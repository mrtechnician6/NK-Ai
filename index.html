<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masala Beads Café</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: #000;
}

#overlay {
  position: absolute;
  top: 40%;
  width: 100%;
  text-align: center;
  color: white;
  z-index: 10;
}

h1 {
  font-size: 3rem;
  letter-spacing: 2px;
}

p {
  font-size: 1.2rem;
  opacity: 0.8;
}

button {
  padding: 12px 24px;
  border: none;
  background: #c49b63;
  color: white;
  cursor: pointer;
  margin-top: 20px;
  font-size: 1rem;
  border-radius: 5px;
}
</style>
</head>

<body>

<div id="overlay">
  <h1>Masala Beads Café</h1>
  <p>Feel the vibe. Experience the moment.</p>
  <button onclick="enterSite()">Enter</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lighting
  const light = new THREE.PointLight(0xffcc88, 2, 100);
  light.position.set(5, 10, 5);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0x404040, 2);
  scene.add(ambient);

  // Floor
  const geometry = new THREE.PlaneGeometry(50, 50);
  const material = new THREE.MeshStandardMaterial({ color: 0x2b2b2b });
  const floor = new THREE.Mesh(geometry, material);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Table (basic 3D object)
  const tableGeo = new THREE.CylinderGeometry(1, 1, 0.2, 32);
  const tableMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
  const table = new THREE.Mesh(tableGeo, tableMat);
  table.position.y = 1;
  scene.add(table);

  // Coffee cup (simple)
  const cupGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.6, 32);
  const cupMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const cup = new THREE.Mesh(cupGeo, cupMat);
  cup.position.set(0, 1.5, 0);
  scene.add(cup);

  camera.position.z = 8;
  camera.position.y = 3;

  animate();
}

function animate() {
  requestAnimationFrame(animate);

  // slight floating animation
  camera.position.y = 3 + Math.sin(Date.now() * 0.001) * 0.1;

  renderer.render(scene, camera);
}

function enterSite() {
  document.getElementById("overlay").style.display = "none";
  init();
}

// resize fix
window.addEventListener('resize', () => {
  if (!camera) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
